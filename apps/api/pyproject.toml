[project]
name = "blocktool-api"
version = "0.1.0"
description = "积木建模工具 — 后端 FastAPI + Celery. 详见 ../README.md"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-json-logger>=2.0",
    # ---- 3D 重建依赖 ----
    # Open3D 必须在容器内可用 (design.md §4 强制要求). Meshroom / COLMAP
    # 不强求装进容器 — 如果镜像里没装,worker 退回到 Open3D-only 路径
    # (trimesh 估位姿 + Poisson / Ball Pivoting 重建) 或通过 MESHROOM_BIN
    # / COLMAP_BIN 环境变量指向 host 上预装的 binary.
    # numpy / scipy / pillow 是 open3d 与 trimesh 的传递依赖,这里显式钉住
    # 下界避免 lockfile 抖动.
    "open3d==0.18.0",  # 钉到 0.18.0: 0.19.0 在 PyPI 官方 simple index 缺失 (only files.pythonhosted.org 直链可下), pip 解析不到, docker build 失败
    "trimesh>=4.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# 老的占位 extra (留给不希望装 open3d 的 CI 环境). 主依赖已经把上面 5 个
# 提升到 [project].dependencies,这样 `uv sync` 默认就会装上.
reconstruct = []

[dependency-groups]
# Dev tooling for the api package itself (pytest, ruff, mypy, ...).
# Shared tooling (pytest, ruff, mypy) is also declared at the workspace root.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each subdirectory under `src/` is a top-level Python package.
# (Using the `src/` layout keeps the test tree isolated from the package
# tree, which is the recommended pattern for hatchling.)
packages = [
    "src/app",
    "src/api",
    "src/core",
    "src/db",
    "src/models",
    "src/pipelines",
    "src/services",
    "src/storage",
    "src/workers",
]
